# Record recipe — bimanual Elite CS66 RT (diagonal mount, bench 08) + Bi-Pico4.
# SMOKE TEST.
#   lerobot-record --config_path=recipes/record/bi_elite_cs66_rt/test.yaml
#
# Self-contained: this file carries both the bench hardware and the run's tuning.
# Anything not listed uses the dataclass default. The robot:/teleop: blocks mirror
# recipes/teleop/bi_elite_cs66_rt/diagonal-08-xgripper.yaml (same bench) — keep in sync.
#
# Gripper variant: xgripper. The sibling test-taccap.yaml is the same bench
# with the other gripper family — the two differ only in `gripper:`.

robot:
  type: bi_elite_cs66_rt
  # Validated bench-08 serial-gripper assembly; overrides the legacy mount angles below.
  native_assembly: diagonal-08
  # Teach-pendant TCP in metres (tool0 <- TCP); zero TCP rotation on both arms.
  # These measurements do not apply to bench 07 or to the TacCap gripper variant.
  left_tool_transform: [1.0, 0.0, 0.0, 0.0068,
                        0.0, 1.0, 0.0, -0.0063,
                        0.0, 0.0, 1.0, 0.1941,
                        0.0, 0.0, 0.0, 1.0]
  right_tool_transform: [1.0, 0.0, 0.0, -0.0080,
                         0.0, 1.0, 0.0, -0.0065,
                         0.0, 0.0, 1.0, 0.1920,
                         0.0, 0.0, 0.0, 1.0]

  # ── Bench hardware (diagonal-08) ────────────────────────────────────────────
  left_robot_ip: "192.168.8.53"
  right_robot_ip: "192.168.8.223"
  left_local_ip: "" # "" lets the OS route; set to pin the host NIC for RTSI
  right_local_ip: ""
  # Joint angles in RADIANS (J1..J6), the units the Elite SDK takes.
  left_start_position_rad: [-1.3963, -0.5236, 1.5708, -0.5236, 1.5708, -0.7854]
  right_start_position_rad: [-1.7453, -2.618, -1.5708, -2.618, -1.5708, -0.7854]
  left_home_position_rad: [-1.3963, -0.5236, 1.5708, -0.5236, 1.5708, -0.7854]
  right_home_position_rad: [-1.7453, -2.618, -1.5708, -2.618, -1.5708, -0.7854]

  # ── Mounting ────────────────────────────────────────────────────────────────
  # Same diagonal/opposed mounting as diagonal-07 — see that recipe for the full
  # derivation (the pendant's 45/90 assumes a tilt about base-X, but the LEFT arm
  # is actually tilted 45° about base-Y, verified by freedrive-probe measurement
  # plus base-link geometry; the 180° world_yaw is the residual yaw about gravity
  # that the pendant cannot show). *_world_rotation OVERRIDES the angles; the
  # angles are kept because they record what the pendant reads.
  left_mount_tilt_deg: 45.0
  left_mount_zrot_deg: 90.0
  left_mount_world_yaw_deg: 180.0
  right_mount_tilt_deg: 45.0
  right_mount_zrot_deg: 90.0
  right_mount_world_yaw_deg: 0.0
  left_world_rotation:
    - [0.0, 1.0, 0.0]
    - [-0.70710678, 0.0, 0.70710678]
    - [0.70710678, 0.0, 0.70710678]
  right_world_rotation:
    - [0.0, -1.0, 0.0]
    - [0.70710678, 0.0, -0.70710678]
    - [0.70710678, 0.0, 0.70710678]

  # ── Cameras ─────────────────────────────────────────────────────────────────
  # Only the head is pinned: both gripper backends sniff their own wrist +
  # tactile cameras off the gripper's USB hub at connect.
  # These are OG sensors; each tactile camera carries the exposure override tuned
  # for this bench. GSPS sensors (the TacCap grippers) must NOT use these values —
  # they belong on their own xpack template (omit camera_properties).
  cameras:
    head:
      type: intelrealsense
      serial_number_or_name: "346522074942"
      fps: 30
      width: 640
      height: 480
      warmup_s: 1
      use_depth: false
    # Wrist + tactile are discovered off each gripper's USB hub at connect
    # (gripper.auto_discover_cameras). What this bench had when the pins were
    # removed, for cross-checking the first discovery run:
    #   left_tactile_left: OG001349
    #   left_tactile_right: OG001350
    #   left_wrist: XC000045
    #   right_tactile_left: OG001351
    #   right_tactile_right: OG001352
    #   right_wrist: XC000046

  # ── Control ─────────────────────────────────────────────────────────────────
  control_mode: cartesian_servo # cartesian_servo | joint_servo
  servoj_gain: 300 # [100, 2000]
  # ── Gripper ── One block for both arms; `side` is stamped per arm at build time.
  # Both grippers -> XenseSerialGripper over USB serial (no IP / MAC / network).
  # Neither port nor sn is pinned: parity discovery reads each board's SN and
  # resolves the side from it, which then anchors the camera sniff above.
  gripper:
    type: serial
    gripper_v_max: 100.0    # mm/s
    gripper_f_max: 30.0     # N
    gripper_min_pos: 0.0    # mm — fully closed
    gripper_max_pos: 85.0   # mm — fully open
    serial_timeout: 1.0
    init_open: true
    auto_discover_cameras: true   # sniff wrist + tactile off this gripper's USB hub
    enable_tactile: true
    # Everything else worth tuning, at its default — uncomment to change.
    # port: ""                            # explicit /dev path; overrides sn + side
    # sn: null                            # board SN; scanned across ports when port unset
    # side: null                          # stamped automatically per arm — do not set here
  left_use_gripper: true
  right_use_gripper: true

  # ── Singularity / joint-overspeed guards (fixes the down-near-table trips) ──
  # Predicted joint-velocity guard (model-based, needs NO live tuning): bounds the
  # predicted joint step BEFORE the controller IK spikes past JOINT_IGNORE_SPEED
  # (30 rad/s) and drops external control. Naturally directional — holds motion
  # INTO a wrist(q5≈0)/elbow/boundary singularity, allows escape. Uses DH fetched
  # per-arm at connect + these datasheet CS66 rates (J1/J2 150°/s, J3 180°/s,
  # J4-6 230°/s). Watch the connect log for "Kinematic scaling enabled
  # [joint-vel-limit]"; if it logs "...disabled" the DH fetch / FK self-check
  # failed and the guard fail-safes off (resolve DH before relying on it).
  joint_vel_limits_rad_s: [2.618, 2.618, 3.142, 4.014, 4.014, 4.014]
  joint_vel_limit_margin: 0.8 # enforce at 80% of the limits; lower (e.g. 0.6) for more headroom
  # Per-servo-tick velocity ceiling — smooths jumpy Pico4 wrist tracking at the source.
  max_lin_speed: 0.25 # m/s
  max_ang_speed: 1.0  # rad/s (matches the Bi-Pico4 max_rot_velocity default)

  # NOTE: max_reach_radius intentionally left OFF (config default None). The 2026-07-09
  # trip was NOT a reach-boundary problem — the flange was at 0.82 m (well inside the
  # ~0.91 m reach) in a near-singular direction (w=0.051), and a base-origin sphere is
  # the wrong model anyway (the ~194mm tool makes TCP-distance a poor reach proxy). The
  # real fix is the model-based joint-vel guard, which is now enabled once the FK
  # self-check passes on position (see the singularity_* / joint_vel_* handling).

teleop:
  type: bi_pico4
  pos_sensitivity: 1.0
  ori_sensitivity: 1.0

dataset:
  repo_id: Xense/bi_elite_cs66_rt_test
  single_task: "pick up the cube and place it in the box"
  fps: 30 # must equal teleop fps
  episode_time_s: 60
  reset_time_s: 15
  num_episodes: 2
  video: true
  push_to_hub: false
  private: false

# ── Record loop (top level) ──
display_data: true
resume: false
