# Teleop recipe — bimanual Flexiv Rizon4 RT (forward mount, bench 01) + Bi-Pico4,
# with TacCap follower grippers.
#   lerobot-teleoperate --config_path=recipes/teleop/bi_flexiv_rizon4_rt/forward-01-taccap.yaml
#
# Bench 01 carries both gripper families; the arm block is identical either way,
# so the two recipes differ only in `gripper:`. For the parallel-jaw pair see
# forward-01-xgripper.yaml.
#
# Self-contained: this file carries both the bench hardware and the run's tuning.
# Anything not listed uses the dataclass default.
#
# Verified on the bench 2026-08-19: start/home poses confirmed by the operator;
# grippers TCGU01A25Z0011s (left, hub 3-1) / TCGU01A25Z0012s (right, hub 3-5);
# head RealSense 337322070722 present.

robot:
  type: bi_flexiv_rizon4_rt

  # ── Bench hardware (forward-01) ─────────────────────────────────────────────
  left_robot_sn: Rizon4s-063458
  right_robot_sn: Rizon4s-063670
  # Joint angles in DEGREES (J1..J7), the units flexiv_rt takes.
  left_start_position_degree: [88.62, 74.83, 22.87, 112.79, -0.55, 87.02, 0.72]
  right_start_position_degree: [-24.33, 71.20, -4.84, 118.72, 3.88, 95.72, 3.64]
  left_home_position_degree: [88.62, 74.83, 22.87, 112.79, -0.55, 87.02, 0.72]
  right_home_position_degree: [-24.33, 71.20, -4.84, 118.72, 3.88, 95.72, 3.64]

  # ── Cameras ─────────────────────────────────────────────────────────────────
  # Only the head is pinned: taccap_auto_discover_cameras (below) sniffs the
  # per-side wrist + GSPS tactile cameras off each gripper's USB hub at connect.
  cameras:
    head:
      type: intelrealsense
      serial_number_or_name: "337322070722"
      fps: 30
      width: 640
      height: 480
      warmup_s: 1
      use_depth: false

  # ── Control ─────────────────────────────────────────────────────────────────
  use_force: false
  log_level: INFO

  # ── Gripper ── One block for both arms; `side` is stamped per arm at build time.
  # Both grippers -> xense.taccap FollowerGripper (matched pair, single switch).
  # auto_discover_cameras sniffs the wrist + GSPS tactile SNs off each gripper's
  # USB hub at connect, which is why only the head camera is pinned above.
  gripper:
    type: taccap_follower

    # Change this one value, then restart lerobot-teleoperate:
    #   control_loop   = normalized position impedance (ControlLoop)
    #   force_position = contact-aware close, then pure-torque hold
    # The SDK exposes these two background controllers. Motor.set_position /
    # set_velocity / set_torque / set_impedance are low-level one-shot commands
    # and must not run concurrently with either controller.
    controller: force_position

    # ── ControlLoop parameters (used only when controller: control_loop) ──────
    kp: 20.0                         # Nm/rad, position stiffness
    kd: 0.3                         # Nm·s/rad, velocity damping
    # A small constant closing bias remains active when target=0 and the
    # calibrated position error has vanished, so the jaw stays seated/loaded.
    feedforward_torque: -0.20       # Nm; negative closes, positive opens
    control_hz: 100                 # used only by free_running; stream_locked ignores it
    submit_phase: stream_locked     # stream_locked | free_running
    # 0.9 position + 0.2 closing bias keeps the nominal closing demand at 1.1 Nm.
    max_position_torque_nm: 0.9     # kp*position-error contribution limit; 0 disables
    rated_torque_nm: 1.1            # measured-torque backstop; 0 disables
    rated_hold_ms: 20
    rated_release_rad: 0.05
    stall_torque_nm: 1.2
    stall_vel_radps: 0.15
    stall_hold_ms: 60
    stall_action: hold_position     # hold_position | none

    # Shared motor-status stream rate for both controllers.
    motor_stream_hz: 100            # valid range: 1..100 Hz

    # ── Runtime status print (both controllers) ───────────────────────────────
    # Uses each controller's in-memory stream snapshot: no extra motor polling,
    # ACK traffic, or background thread. L/R occupy two fixed live-panel rows.
    # ControlLoop ends in measured hz; ForcePosition ends in state + commanded torque.
    print_status: true              # one-click switch: true | false
    status_print_hz: 5.0            # row-content rate; teleop stays 30 Hz, SDK stream 100 Hz

    # ── ForcePositionController parameters (used only for force_position) ─────
    close_position: 0.0             # normalized [0,1], 0 = fully closed
    close_speed_radps: 3.0           # lower impact speed reduces zero-stop rebound
    grasp_torque_nm: 1.8            # target torque after contact (positive magnitude)
    hold_torque_limit_nm: 1.8       # ceiling only; motor continuous/rated limit
    motion_torque_limit_nm: 6.0     # peak/transient ceiling, not holding torque
    contact_torque_nm: 0.08         # contact detector floor, not grasp target
    contact_vel_radps: 0.035
    contact_vel_ratio: 0.25
    contact_moved_rad: 0.01
    position_kp: 20.0
    position_kd: 1.0
    brake_distance_rad: 0.10
    close_endpoint_tolerance_rad: 0.03
    contact_samples: 3
    startup_guard_ms: 250
    status_timeout_ms: 350

    auto_discover_cameras: true
    enable_tactile: true
    # ── Wrist fisheye rectification ── the intrinsics live in THIS gripper's MCU
    # flash, so the switch travels with the gripper. Needs auto_discover_cameras
    # on (it is applied to the wrist camera as it is discovered); a recipe that
    # pins cameras by hand sets `undistort:` on the wrist camera block instead.
    # An uncalibrated unit falls back to the SDK's shared reference intrinsics
    # with a warning — close, but not this unit's.
    undistort_wrist: false
    # fisheye_balance: 0.0                # 0 = calibrated focal length; 1 = 0.70x, widest FOV
    require_calibrated: true
    init_open: true
    # Everything else worth tuning, at its default — uncomment to change.
    # side: left                          # stamped automatically per arm — do not set here
    # mcu_device: null                    # explicit MCU path; the arm fills this from discovery
  left_use_gripper: true
  right_use_gripper: true

teleop:
  type: bi_pico4
  pos_sensitivity: 1.0
  ori_sensitivity: 1.0

# ── Teleoperate loop (top level) ──
fps: 30
display_data: true
